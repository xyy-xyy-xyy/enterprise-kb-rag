[pytest]
# integration：需要真实 DASHSCOPE_API_KEY 或 Qdrant 服务才能跑。
# CI 上没有这两样，用 `pytest -m "not integration"` 跳过。
markers =
    integration: 需要真实 API Key 或 Qdrant 服务，CI 中跳过

testpaths = tests

# 覆盖率门槛**故意不写在这里**。
# 本来想用 [coverage:report] fail_under，实测（阶段五）pytest-cov 8 不读 pytest.ini
# 里的这个字段 —— 写成 fail_under = 99 时仍然照常通过、退出码 0，也就是门槛会静默失效，
# CI 无论覆盖率多低都是绿的。这种"看起来有门槛其实没有"比不设门槛更危险。
# 所以门槛用 CLI 参数 --cov-fail-under=70 写在 .github/workflows/ci.yml 里，
# 那里是显式的、且实测会真的让退出码变 1。
#
# 基线：CI 环境（VECTOR_BACKEND=faiss + 假 key）下全量离线用例的真实覆盖率
# 是 76.25%（1655 条语句，未覆盖 393 条），门槛 70 留了约 6pp 余量。
