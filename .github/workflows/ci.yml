name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # 必须开缓存：gradio + langchain + faiss 一次要装几分钟
          cache: 'pip'

      - name: 安装依赖
        # 这一步是全仓库唯一"全新环境"的验证点：本机 venv 里多装的包会掩盖
        # requirements.txt 的漏声明，只有在这里装一次才会暴露（阶段五 CI 就栽过：
        # 本机装了 langchain-qdrant、requirements.txt 却没写 → 全新环境 ImportError）。
        # 改依赖后请用 `pip freeze` 与 requirements.txt 做一次差集比对，确认无遗漏。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 离线测试 + 覆盖率
        # 覆盖率门槛用 --cov-fail-under 写在命令行，不写在 pytest.ini 里：
        # 实测 pytest-cov 不读 pytest.ini 的 [coverage:report] fail_under，
        # 写在那里会静默失效（门槛形同虚设，覆盖率再低也是绿标）。
        # 70 的依据：本机与 CI 环境（VECTOR_BACKEND=faiss + 假 key）实测均为
        # 76.25%，留约 6 个百分点余量。
        run: pytest -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=70
        env:
          # config.validate() 在缺 DASHSCOPE_API_KEY 时直接抛 RuntimeError，
          # 所以 CI 上必须注入一个假值。但注入之后，任何真的会发 HTTP 请求的
          # 用例都会挂或超时 —— 那类用例全部标了 @pytest.mark.integration，
          # 由上面的 -m "not integration" 排除，CI 里一次外部请求都不会发。
          DASHSCOPE_API_KEY: dummy-key-for-ci
          # 用本地文件后端，避免 CI 去连并不存在的 Qdrant
          VECTOR_BACKEND: faiss
          # app/main.py 在模块作用域调用 build_ui()，只要导入 app.main 就会向
          # api.gradio.app 查一次版本号。CI 沙箱外网受限时可能卡住或报错，关掉。
          GRADIO_ANALYTICS_ENABLED: "False"
          PYTHONUNBUFFERED: "1"
